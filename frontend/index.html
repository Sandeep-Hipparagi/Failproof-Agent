<!-- Failproof Restaurant Concierge. Developed by Sandeep Hipparagi. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Failproof Concierge</title>
  <style>
    :root{color-scheme:dark;font:16px/1.4 Inter,ui-sans-serif,system-ui;background:#090b10;color:#f4f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#171c27 0,#090b10 53%)}main{width:min(680px,92vw);text-align:center}.orb{width:210px;height:210px;border-radius:50%;border:1px solid #343b49;background:radial-gradient(circle at 36% 28%,#394659,#151a23 58%,#0c0f15);box-shadow:0 0 70px #24354a55,inset 0 0 36px #7891b022;display:grid;place-items:center;margin:0 auto 30px;cursor:pointer;transition:.25s;user-select:none}.orb:hover{transform:scale(1.025)}.orb.listening{border-color:#78b8ff;box-shadow:0 0 90px #298dff66,inset 0 0 42px #3289df55;animation:pulse 1.4s infinite}.orb.speaking{border-color:#a88bff;box-shadow:0 0 90px #886aff66}.orb.verifying{border-color:#ffbf69;box-shadow:0 0 75px #ff9d3e55}@keyframes pulse{50%{transform:scale(1.04)}}.mic{width:38px;height:56px;border:3px solid #dce7f7;border-radius:22px;position:relative}.mic:after{content:"";position:absolute;width:62px;height:31px;border:3px solid #dce7f7;border-top:0;border-radius:0 0 40px 40px;left:50%;top:22px;transform:translateX(-50%)}.mic:before{content:"";position:absolute;width:3px;height:12px;background:#dce7f7;left:50%;top:50px}.state{font-size:13px;color:#9aa6b8;letter-spacing:.14em;text-transform:uppercase;margin-bottom:46px}.telemetry{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill{border:1px solid #252b36;background:#10141c;border-radius:999px;padding:9px 14px;font-size:12px;color:#aeb8c8;max-width:100%}.pill b{font-weight:600;color:#edf2fa}.pill.verdict.allow b{color:#5ee0a0}.pill.verdict.steer b,.pill.verdict.deny b,.pill.verdict.break-loop b{color:#ffb45f}.pill.audio-verified{border-color:#245c43;color:#8ee4b2}.pill.audio-interrupted{border-color:#76531e;color:#ffc46f}.pill.audio-verified b{color:#5ee0a0}.pill.audio-interrupted b{color:#ffb45f}.tools{max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memory{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{height:20px;color:#586274;font-size:12px;margin-top:18px}
  </style>
</head>
<body><main>
  <div id="orb" class="orb" role="button" aria-label="Push to talk"><div class="mic"></div></div>
  <div id="state" class="state">Idle · tap to speak</div>
  <section class="telemetry" aria-live="polite">
    <div class="pill tools"><b>Tools</b> <span id="tools">none</span></div>
    <div id="verdictPill" class="pill verdict allow"><b>Enclave</b> <span id="verdict">ALLOW</span></div>
    <div id="memoryPill" class="pill memory"><b>Memory</b> <span id="memory">active</span></div>
  </section><div id="hint" class="hint"></div>
</main>
<script>
(() => {
  const orb=document.querySelector('#orb'), stateEl=document.querySelector('#state'), toolsEl=document.querySelector('#tools'), verdictEl=document.querySelector('#verdict'), verdictPill=document.querySelector('#verdictPill'), memoryEl=document.querySelector('#memory'), hint=document.querySelector('#hint');
  let ws,ctx,stream,source,processor,recording=false,currentAudio=null,audioTask=0,activeTools=new Set(),activeOfferAudio=null,isPlayingTTS=false,speechEnergySince=0,bargeInSent=false;
  const setState=s=>{stateEl.textContent=s==='Idle'?'Idle · tap to speak':s;orb.className='orb '+s.toLowerCase().replaceAll(' ','-')};
  function connect(){if(ws&&ws.readyState<2)return;ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.binaryType='arraybuffer';ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='status')setState(m.state);if(m.type==='transcript')hint.textContent=m.text;if(m.type==='tool'){activeTools.add(m.name);toolsEl.textContent=[...activeTools].join(', ')||'none';if(m.name==='execute_reservation'&&m.result.confirmed)memoryEl.textContent=`Booked: ${m.result.restaurant_name} @ ${m.result.time_slot}`}if(m.type==='enclave'){verdict.textContent=m.verdict==='allow'?'ALLOW':m.verdict==='steer'?'STEER / INTERCEPTED':m.verdict.toUpperCase();verdictPill.className='pill verdict '+m.verdict}if(m.type==='telemetry')hint.textContent=m.message;if(m.type==='playback_verification'){if(m.status==='verified')showAudioStatus(true);else if(m.status==='interrupted')showAudioStatus(false)}if(m.type==='response'){hint.textContent=m.text;activeTools.clear();toolsEl.textContent='none';if(/diet|vegetarian|gluten|cuisine/i.test(m.text))memoryEl.textContent='preferences active'}if(m.type==='audio')playAudio(m);if(m.type==='barge_in_ack')stopAudio(true)};ws.onclose=()=>{setState('Idle');hint.textContent='Connection closed'}}
  async function playAudio(message){stopAudio(false);const id=++audioTask;setState('Speaking');try{const bytes=Uint8Array.from(atob(message.audio),c=>c.charCodeAt(0));const audio=new Audio(URL.createObjectURL(new Blob([bytes],{type:'audio/wav'})));currentAudio=audio;activeOfferAudio=message.offer_id&&message.requires_playback_ack?{offer_id:message.offer_id,id}:null;audio.onplay=()=>{isPlayingTTS=true};audio.onended=()=>{if(id===audioTask){isPlayingTTS=false;if(activeOfferAudio&&activeOfferAudio.id===id&&ws.readyState===1){ws.send(JSON.stringify({type:'TTS_PLAYBACK_COMPLETED',offer_id:activeOfferAudio.offer_id,client_ts:Date.now()}));showAudioStatus(true)}activeOfferAudio=null;currentAudio=null;setState('Idle')}};await audio.play()}catch(e){isPlayingTTS=false;if(activeOfferAudio){showAudioStatus(false);activeOfferAudio=null}hint.textContent='Sarvam audio playback unavailable'}}
  function showAudioStatus(ok){const pill=document.querySelector('#memoryPill');pill.className='pill memory '+(ok?'audio-verified':'audio-interrupted');memoryEl.textContent=ok?'OFFER AUDIO VERIFIED':'BARGE-IN: OFFER UNVERIFIED';setTimeout(()=>{if(memoryEl.textContent===(ok?'OFFER AUDIO VERIFIED':'BARGE-IN: OFFER UNVERIFIED')){memoryEl.textContent='active';pill.className='pill memory'}},4000)}
  function stopAudio(interrupted=false){audioTask++;isPlayingTTS=false;if(activeOfferAudio&&interrupted&&ws&&ws.readyState===1){ws.send(JSON.stringify({type:'TTS_PLAYBACK_INTERRUPTED',offer_id:activeOfferAudio.offer_id,client_ts:Date.now()}));showAudioStatus(false)}activeOfferAudio=null;if(currentAudio){currentAudio.onended=null;currentAudio.pause();currentAudio.src='';currentAudio=null}}
  async function start(){connect();if(!ws||ws.readyState!==1){hint.textContent='Connecting…';return}speechEnergySince=0;bargeInSent=false;setState('Listening');activeTools.clear();toolsEl.textContent='none';stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});ctx=new AudioContext({sampleRate:16000});source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(2048,1,1);processor.onaudioprocess=ev=>{if(!recording||ws.readyState!==1)return;const samples=ev.inputBuffer.getChannelData(0);if(isPlayingTTS&&!bargeInSent){let energy=0;for(let i=0;i<samples.length;i++)energy+=samples[i]*samples[i];const rms=Math.sqrt(energy/samples.length);if(rms>0.035){if(!speechEnergySince)speechEnergySince=performance.now();if(performance.now()-speechEnergySince>=250){bargeInSent=true;ws.send(JSON.stringify({type:'USER_SPEAKING_START'}));stopAudio(true)}}else speechEnergySince=0}else if(!isPlayingTTS&&!bargeInSent){bargeInSent=true;ws.send(JSON.stringify({type:'USER_SPEAKING_START'}))}ws.send(toPcm16(samples))};source.connect(processor);processor.connect(ctx.destination);recording=true}
  async function end(){if(!recording)return;recording=false;processor.disconnect();source.disconnect();stream.getTracks().forEach(t=>t.stop());await ctx.close();ws.send(JSON.stringify({type:'AUDIO_END'}));setState('Verifying Tools')}
  function toPcm16(samples){const out=new Int16Array(samples.length);for(let i=0;i<samples.length;i++){const s=Math.max(-1,Math.min(1,samples[i]));out[i]=s<0?s*32768:s*32767}return out.buffer}
  orb.addEventListener('pointerdown',e=>{e.preventDefault();start().catch(err=>{setState('Idle');hint.textContent='Microphone access is required'})});window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();start().catch(()=>{})}});window.addEventListener('keyup',e=>{if(e.code==='Space')end()});connect();
})();
</script></body></html>
