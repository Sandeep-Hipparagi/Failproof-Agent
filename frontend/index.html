<html lang="en">

  <title>Failproof | Voice Concierge</title>

    .orb-button{width:min(56vw,340px);height:min(56vw,340px);min-width:238px;min-height:238px;border:0;border-radius:50%;padding:0;position:relative;background:transparent;cursor:pointer;outline:none;touch-action:none}

    .orb-button:after{inset:0;border-color:color-mix(in srgb,var(--accent) 17%,transparent);animation-delay:-3s;animation-duration:8s}
    @keyframes ring{50%{transform:scale(1.045);opacity:.5}}
    #voiceOrb{position:absolute;inset:12%;width:76%;height:76%;border-radius:50%;background:radial-gradient(circle at 34% 27%,#394457,#141923 48%,#0b0e14 78%);box-shadow:inset 0 2px 2px #ffffff25,0 20px 90px #0009;z-index:1;display:block}
    .orb-button:hover{filter:brightness(1.12)}.orb-button:active{transform:scale(.985)}.orb-button:focus-visible{outline:2px solid var(--accent);outline-offset:12px}
    .caption{height:22px;margin:28px 0 0;color:#c5ccda;font:500 12px/1.4 "JetBrains Mono",Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}.subcaption{margin:6px 0 0;color:#6d788a;font-size:11px;line-height:1.4;max-width:min(680px,90vw);min-height:16px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

    @media(max-width:650px){main{padding-bottom:180px}.dock{grid-template-columns:1fr;bottom:14px;gap:6px;width:min(440px,92vw)}.pill{height:42px;border-radius:13px}.orb-button{min-width:218px;min-height:218px}.brand{margin-bottom:16px}.caption{margin-top:20px}.drawer{padding:18px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body data-state="idle">
  <div class="topbar"><button class="drawer-toggle" id="drawerToggle">Enclave Control Plane</button></div>
  <main>
    <div class="brand">Failproof · Voice Concierge</div>
    <button class="orb-button" id="voiceButton" aria-label="Hold to speak"><canvas id="voiceOrb" aria-hidden="true"></canvas></button>

  <section class="dock" aria-label="Live voice status">

    <div class="pill" id="enclavePill"><span class="dot"></span><span class="pill-label">Enclave</span><span class="pill-value" id="enclaveValue">ALLOW</span><span class="worm-badge" id="wormBadge">WORM #0000 ✓</span></div>
    <div class="pill" id="memoryPill"><span class="dot"></span><span class="pill-label">Graph Memory</span><span class="pill-value" id="memoryValue">Connecting</span></div>
  </section>
  <div class="drawer-scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head"><div class="drawer-title">Control Plane</div><button class="close" id="drawerClose" aria-label="Close control plane">×</button></div>

    <div class="panel-content" id="panelContent"></div>
    <div class="drawer-footer">DEVELOPED BY SANDEEP HIPPARRAGI · LIVE RUNTIME TELEMETRY</div>
  </aside>
<script>

  function animateOrb(now=0){rafId=requestAnimationFrame(animateOrb);if(document.hidden)return;const analyser=recording?micAnalyser:ttsAnalyser;let low=0,high=0,sum=0;if(analyser){if(analyserBins.length!==analyser.frequencyBinCount)analyserBins=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(analyserBins);for(let i=0;i<analyserBins.length;i++){const value=analyserBins[i],v=value/255;sum+=value;if(i<4)low+=v;else if(i>analyserBins.length*.55)high+=v}low/=Math.min(4,analyserBins.length)||1;high/=Math.max(1,analyserBins.length*.45);audioLevel=sum/Math.max(1,analyserBins.length)/255}bassLevel+=(low-bassLevel)*.18;trebleLevel+=(high-trebleLevel)*.14;if(!gl||!orbProgram)return;resizeCanvas();gl.useProgram(orbProgram);gl.uniform2f(orbUniforms.u_resolution,orbWidth,orbHeight);gl.uniform1f(orbUniforms.u_time,now*.001);gl.uniform1f(orbUniforms.u_level,audioLevel);gl.uniform1f(orbUniforms.u_bass,bassLevel);gl.uniform1f(orbUniforms.u_treble,trebleLevel);gl.uniform1f(orbUniforms.u_state,orbState);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,6)}

  function resampleTo16k(samples,inputRate){if(inputRate===16000)return samples;const step=inputRate/16000,length=Math.floor(samples.length/step),output=new Float32Array(length);for(let i=0;i<length;i++){const position=i*step,left=Math.floor(position),fraction=position-left,right=Math.min(left+1,samples.length-1);output[i]=samples[left]+(samples[right]-samples[left])*fraction}return output}
  async function start(){connect();if(recording)return;if(audioContextIdleTimer){clearTimeout(audioContextIdleTimer);audioContextIdleTimer=null}try{try{audioContext=new AudioContext({sampleRate:16000})}catch{audioContext=new AudioContext()}await audioContext.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}})}catch(error){if(audioContext&&audioContext.state!=='closed')await audioContext.close().catch(()=>{});caption.textContent=error?.name==='NotAllowedError'?'Microphone permission required':'Audio input unavailable';console.warn('[STT-IN] microphone initialization failed',error?.name||'unknown');return}console.info('[STT-IN] capture started',JSON.stringify({context_sample_rate:audioContext.sampleRate,wire_sample_rate:16000,channels:1,format:'pcm_s16le'}));source=audioContext.createMediaStreamSource(stream);micAnalyser=audioContext.createAnalyser();micAnalyser.fftSize=128;source.connect(micAnalyser);processor=audioContext.createScriptProcessor(2048,1,1);source.connect(processor);const silent=audioContext.createGain();silent.gain.value=0;processor.connect(silent);silent.connect(audioContext.destination);recording=true;hasVoice=false;bargeInSent=false;bargeSince=0;captureOverflow=false;pendingPcm=[];pendingAudioEnd=false;processor.onaudioprocess=(event)=>{if(!recording)return;const samples=event.inputBuffer.getChannelData(0);let power=0;for(let i=0;i<samples.length;i++)power+=samples[i]*samples[i];const rms=Math.sqrt(power/samples.length);if(currentAudio&&rms>.025&&!bargeInSent){if(!bargeSince)bargeSince=performance.now();if(performance.now()-bargeSince>=250){bargeInSent=true;signalUserStart(true);stopAudio(true)}}else if(rms<.025)bargeSince=0;if(rms<.004)return;if(!hasVoice){hasVoice=true;if(!bargeInSent)signalUserStart(false)}const audio16=resampleTo16k(samples,audioContext.sampleRate),pcm=new Int16Array(audio16.length);for(let i=0;i<audio16.length;i++){const n=Math.max(-1,Math.min(1,audio16   async function playAudio(message){if(!message.audio)return;stopAudio(Boolean(currentAudioOfferId));if(audioContextIdleTimer){clearTimeout(audioContextIdleTimer);audioContextIdleTimer=null}const bytes=Uint8Array.from(atob(message.audio),char=>char.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));const audio=new Audio(url);currentAudio=audio;currentAudioUrl=url;currentAudioOfferId=message.offer_id&&message.requires_playback_ack?message.offer_id:null;playbackAckToken=message.playback_ack_token||null;if(!audioContext||audioContext.state==='closed')audioContext=new AudioContext();try{await audioContext.resume();currentMediaSource=audioContext.createMediaElementSource(audio);ttsAnalyser=audioContext.createAnalyser();ttsAnalyser.fftSize=128;currentMediaSource.connect(ttsAnalyser);ttsAnalyser.connect(audioContext.destination)}catch(error){console.error('[TTS-OUT] Web Audio output setup failed',error?.name||'unknown');currentMediaSource=null;ttsAnalyser=null}const cleanup=()=>{if(currentMediaSource){try{currentMediaSource.disconnect()}catch{}currentMediaSource=null}if(currentAudioUrl){URL.revokeObjectURL(currentAudioUrl);currentAudioUrl=null}ttsAnalyser=null;scheduleAudioContextClose()};audio.onplay=()=>setState('speaking');audio.onended=()=>{if(currentAudio===audio){if(currentAudioOfferId&&playbackAckToken&&ws?.readyState===WebSocket.OPEN){ws.send(JSON.stringify({type:'TTS_PLAYBACK_COMPLETED',offer_id:currentAudioOfferId,playback_ack_token:playbackAckToken,client_ts:Date.now()}));$('#acousticPill').dataset.tone='good';$('#acousticValue').textContent='OFFER AUDIO VERIFIED'}cleanup();currentAudio=null;currentAudioOfferId=null;playbackAckToken=null;setState('idle')}};audio.onerror=()=>{if(currentAudio===audio){cleanup();currentAudio=null;currentAudioOfferId=null;playbackAckToken=null;setState('idle')}};try{await audio.play()}catch(error){console.error('[TTS-OUT] browser playback rejected',error?.name||'unknown');audio.onerror()}}

  let activeTab='Home';
  const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  async function get(url){const response=await fetch(url);if(!response.ok)throw new Error(`${response.status}`);return response.json()}
  async function renderTab(tab){activeTab=tab;const request=++renderGeneration;const isCurrent=()=>request===renderGeneration&&activeTab===tab&&drawer.classList.contains('open');document.querySelectorAll('.tab').forEach(node=>node.classList.toggle('active',node.dataset.tab===tab));panel.innerHTML='<div class="muted">Loading live telemetry…</div>';try{let data;if(tab==='Home'){data=await get('/api/home/overview');if(!isCurrent())return;panel.innerHTML=`<div class="metric-grid">${[['Voice turns',data.voice_turns],['Live sessions',data.active_sessions],['Interception saves',data.interception_saves],['Avg. voice latency',`${(data.avg_voice_latency_seconds*1000).toFixed(0)} ms`],['Active policies',data.policies_deployed],['Graphiti',data.graphiti_status],['Ledger height',data.ledger_block_height],['Ledger integrity',data.ledger_integrity_verified?'Verified':'Failed']].map(([k,v])=>`<div class="metric"><span>${escapeHtml(k)}</span><b>${escapeHtml(v)}</b></div>`).join('')}</div>`}

      if(tab==='Analyse'){data=await get('/api/analyse/checks');if(!isCurrent())return;panel.innerHTML=`<div class="metric"><span>Reliability score</span><b>${escapeHtml(data.reliability_score)}%</b></div><div class="list">${Object.entries(data.checks||{}).map(([name,ok])=>`<div class="row"><b>${escapeHtml(name)}</b><span class="${ok?'ok':'bad'}">${ok?'PASS':'FAIL'}</span></div>`).join('')}${(data.alerts||[]).slice(-5).reverse().map(a=>`<div class="row"><b>${escapeHtml(a.severity)} · ${escapeHtml(a.code)}</b><span>${new Date(a.server_ts*1000).toLocaleTimeString()}</span></div>`).join('')}</div>`}
    }catch{if(isCurrent())panel.innerHTML='<div class="muted">Control plane telemetry is temporarily unavailable.</div>'}}
  function openDrawer(){drawer.classList.add('open');scrim.classList.add('open');drawer.setAttribute('aria-hidden','false');renderTab(activeTab)}function closeDrawer(){renderGeneration++;drawer.classList.remove('open');scrim.classList.remove('open');drawer.setAttribute('aria-hidden','true')}
  $('#drawerToggle').onclick=openDrawer;$('#drawerClose').onclick=closeDrawer;scrim.onclick=closeDrawer;document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>renderTab(tab.dataset.tab));button.addEventListener('pointerdown',event=>{event.preventDefault();start().catch(()=>{caption.textContent='Microphone permission required'})});window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);window.addEventListener('keydown',event=>{if(event.code==='Space'&&!event.repeat){event.preventDefault();start().catch(()=>{})}});window.addEventListener('keyup',event=>{if(event.code==='Space')end()});window.addEventListener('resize',resizeCanvas);resizeCanvas();animateOrb();connect();
